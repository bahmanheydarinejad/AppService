<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <div class="card">
        <h3>✉ Mail Management &amp; Live Template Studio</h3>
        <p style="color: #94a3b8;">Edit dynamic email templates with token interpolation and dispatch simulated test emails.</p>

        <h:form id="mailStudioForm">
            <p:messages id="mailMsgs" showDetail="true" closable="true"/>

            <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                <div style="flex: 1;">
                    <h4>Template Source (Jinja2 / Token syntax):</h4>
                    <p:inputTextarea value="#{mailManagementBean.templateSource}" rows="8" style="width: 100%;">
                        <p:ajax event="keyup" listener="#{mailManagementBean.renderPreview}" update=":mailStudioForm:previewOutput"/>
                    </p:inputTextarea>
                </div>
                <div style="flex: 1;">
                    <h4>Live Rendered HTML Preview:</h4>
                    <h:panelGroup id="previewOutput" layout="block" style="background: #0f172a; padding: 12px; border-radius: 6px; min-height: 150px;">
                        <h:outputText value="#{mailManagementBean.previewHtml}" escape="false"/>
                    </h:panelGroup>
                </div>
            </div>

            <h4>Dispatch Verification Email</h4>
            <div style="display: flex; gap: 12px; align-items: center;">
                <p:inputText value="#{mailManagementBean.testRecipient}" placeholder="Recipient Email"/>
                <p:inputText value="#{mailManagementBean.testSubject}" placeholder="Subject"/>
                <p:commandButton value="Send Test Email" action="#{mailManagementBean.sendTestEmail}" update=":mailStudioForm"/>
            </div>
        </h:form>
    </div>
</ui:composition>
