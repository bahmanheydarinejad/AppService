<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <div class="card">
        <h3>⏱ Job Scheduler Management Panel</h3>
        <p style="color: #94a3b8;">Manage clustered Quartz job triggers, trigger instant executions, and monitor scheduled triggers.</p>

        <h:form id="schedulerForm">
            <p:messages id="schedulerMsgs" showDetail="true" closable="true"/>

            <p:commandButton value="Refresh Jobs" action="#{jobSchedulerBean.loadJobs}" update=":schedulerForm" style="margin-bottom: 16px;"/>

            <p:dataTable var="job" value="#{jobSchedulerBean.jobs}" emptyMessage="No clustered jobs registered." rows="10">
                <p:column headerText="Job Name">
                    <h:outputText value="#{job.jobName}"/>
                </p:column>
                <p:column headerText="Group">
                    <h:outputText value="#{job.jobGroup}"/>
                </p:column>
                <p:column headerText="Cron Expression">
                    <code><h:outputText value="#{job.cronExpression}"/></code>
                </p:column>
                <p:column headerText="Next Fire Time">
                    <h:outputText value="#{job.nextExecutionTime}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton value="Fire Now" action="#{jobSchedulerBean.fireNow(job)}" update=":schedulerForm" style="margin-right: 6px;"/>
                    <p:commandButton value="Pause" action="#{jobSchedulerBean.pauseJob(job)}" update=":schedulerForm" style="margin-right: 6px;"/>
                    <p:commandButton value="Resume" action="#{jobSchedulerBean.resumeJob(job)}" update=":schedulerForm"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </div>
</ui:composition>
