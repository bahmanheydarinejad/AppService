<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <div class="card">
        <h3>🔍 Audit Log Dashboard with Trace Filters</h3>
        <p style="color: #94a3b8;">Filter append-only audit events by distributed Trace ID, Actor, or IP with side-by-side masked diffs.</p>

        <h:form id="auditFilterForm">
            <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                <p:inputText id="traceFilter" value="#{auditLogBean.traceIdFilter}" placeholder="Filter by Trace ID (e.g. tr-9481-ac2d)"/>
                <p:inputText id="actorFilter" value="#{auditLogBean.actorIdFilter}" placeholder="Filter by Actor ID"/>
                <p:commandButton value="Filter" action="#{auditLogBean.filterEvents}" update=":auditTableForm"/>
                <p:commandButton value="Clear" action="#{auditLogBean.clearFilters}" update=":auditFilterForm :auditTableForm"/>
            </div>
        </h:form>

        <h:form id="auditTableForm">
            <p:dataTable var="event" value="#{auditLogBean.auditEvents}" emptyMessage="No audit logs recorded." rows="10" paginator="true">
                <p:column headerText="Trace ID">
                    <h:outputText value="#{event.traceId}"/>
                </p:column>
                <p:column headerText="Action">
                    <h:outputText value="#{event.actionVerb}"/>
                </p:column>
                <p:column headerText="Actor">
                    <h:outputText value="#{event.actorId}"/>
                </p:column>
                <p:column headerText="Outcome">
                    <h:outputText value="#{event.outcome}"/>
                </p:column>
                <p:column headerText="Timestamp">
                    <h:outputText value="#{event.timestamp}"/>
                </p:column>
                <p:column headerText="Diff">
                    <p:commandButton value="Inspect Diff" action="#{auditLogBean.selectEvent(event)}" update=":diffViewDialog" oncomplete="PF('diffDialog').show()"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog id="diffViewDialog" header="Before / After State Comparison (Masked)" widgetVar="diffDialog" modal="true" width="700">
            <div style="display: flex; gap: 16px;">
                <div style="flex: 1;">
                    <h4>Before State:</h4>
                    <pre style="background: #0f172a; padding: 12px; border-radius: 6px;"><h:outputText value="#{auditLogBean.sanitizedBeforeState}"/></pre>
                </div>
                <div style="flex: 1;">
                    <h4>After State:</h4>
                    <pre style="background: #0f172a; padding: 12px; border-radius: 6px;"><h:outputText value="#{auditLogBean.sanitizedAfterState}"/></pre>
                </div>
            </div>
        </p:dialog>
    </div>
</ui:composition>
