server:
  port: 8080

app:
  version: '@project.version@'
  name: '@project.name@'
  company:
    page: 'http://www.BahmanHeydariNejad.ir'
    desc: 'Copyright (C) 2026 - AppService Hexagonal Framework'

spring:
  application:
    name: 'appservice-admin-console'
  profiles:
    active: h2

  # Liquibase Migrations
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  # JPA & Hibernate Validation
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: INFO
    ir.appservice: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
