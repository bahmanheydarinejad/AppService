services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 - Multi-Tenant Relational Database
  # Supports: Shared DB (column discriminator), PostgreSQL Schemas, Dedicated DBs
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: appservice-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appservice}
      POSTGRES_USER: ${POSTGRES_USER:-appservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appservice_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appservice} -d ${POSTGRES_DB:-appservice}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appservice-network

  # ---------------------------------------------------------------------------
  # 2. Redis 7 - Distributed Cache, Rate Limiting & Pub/Sub Hot-Reload
  # Supports: i18n translation cache invalidation, Token bucket rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: appservice-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appservice-network

  # ---------------------------------------------------------------------------
  # 3. Apache Kafka 3.7 (KRaft mode - no Zookeeper required)
  # Supports: Event streaming, tamper-resistant audit bus, async SMS dispatch
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: appservice-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - appservice-network

  # ---------------------------------------------------------------------------
  # 4. Kafka UI - Dashboard for inspecting topics, consumers & messages
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: appservice-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - appservice-network

  # ---------------------------------------------------------------------------
  # 5. Mailpit - Local SMTP Testing Server and Web Mailbox
  # Supports: Multi-SMTP Mail Engine (Sprint 6) bounce testing & HTML preview
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: appservice-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP Server
      - "${MAILPIT_UI_PORT:-8025}:8025"    # Web UI Dashboard
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appservice-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  appservice-network:
    name: appservice-network
    driver: bridge
