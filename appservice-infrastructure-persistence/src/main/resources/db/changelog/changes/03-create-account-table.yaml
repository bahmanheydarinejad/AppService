databaseChangeLog:
  - changeSet:
      id: 03-create-account-table
      author: appservice
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_account
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: statue
                  type: VARCHAR(255)
                  defaultValue: ACTIVE_STATUS
              - column:
                  name: registered_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP
              - column:
                  name: delete_date
                  type: TIMESTAMP
              - column:
                  name: account_name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_account_account_name
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: mobile_number
                  type: VARCHAR(255)
              - column:
                  name: natural_person_id
                  type: VARCHAR(255)
              - column:
                  name: avatar_id
                  type: VARCHAR(255)
