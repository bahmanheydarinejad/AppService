databaseChangeLog:
  - changeSet:
      id: 05-create-menu-table
      author: appservice
      changes:
        - createTable:
            tableName: menu
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_menu
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: statue
                  type: VARCHAR(255)
                  defaultValue: ACTIVE_STATUS
              - column:
                  name: registered_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP
              - column:
                  name: delete_date
                  type: TIMESTAMP
              - column:
                  name: priority
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(255)
              - column:
                  name: icon
                  type: VARCHAR(255)
              - column:
                  name: parent_id
                  type: VARCHAR(255)

  - changeSet:
      id: 05-create-panel-table
      author: appservice
      changes:
        - createTable:
            tableName: panel
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_panel
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: statue
                  type: VARCHAR(255)
                  defaultValue: ACTIVE_STATUS
              - column:
                  name: registered_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP
              - column:
                  name: delete_date
                  type: TIMESTAMP
              - column:
                  name: resource_location
                  type: CLOB
              - column:
                  name: menu_id
                  type: VARCHAR(255)
