databaseChangeLog:
  - changeSet:
      id: 04-create-role-table
      author: appservice
      changes:
        - createTable:
            tableName: role
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_role
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: statue
                  type: VARCHAR(255)
                  defaultValue: ACTIVE_STATUS
              - column:
                  name: registered_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP
              - column:
                  name: delete_date
                  type: TIMESTAMP
