######################################################################################
# MySQL Database Configuration
######################################################################################
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ir.appservice.model?autoReconnect=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: AppAdmin
    password: Appadmin123456
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
