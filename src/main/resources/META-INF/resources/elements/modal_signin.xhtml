<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:p="http://primefaces.org/ui"
>

    <p:dialog header="Sign In" widgetVar="signinModal" modal="true" resizable="false"
              appendTo="@(body)">
        <h:form id="MODAL_SIGNIN_FORM" prependId="false">
            <p:growl id="MODAL_GROWL" showDetail="true" life="5000"/>
            <p:messages id="MODAL_MESSAGES" showDetail="true" closable="true"/>

            <h:panelGrid columns="3">

                <h:outputLabel for="modalLoginId" value="Name or Email or Mobile: "
                               icon="fa fa-floppy-o"/>
                <p:inputText id="modalLoginId" value="#{authenticationBean.loginId}" required="true"
                             requiredMessage="Login ID required!" label="Login ID"/>
                <p:message for="modalLoginId" showDetail="false"/>

                <h:outputLabel for="modalPassword" value="Password: "/>
                <p:password id="modalPassword" value="#{authenticationBean.password}" required="true"
                            requiredMessage="Password required!" label="Password"/>
                <p:message for="modalPassword" showDetail="false"/>

            </h:panelGrid>

            <br/>

            <p:commandButton value="Login" icon="fa fa-arrow-circle-up"
                             styleClass="btn-success"
                             update="@form"
                             action="#{authenticationBean.authenticate()}"/>

        </h:form>
    </p:dialog>

</ui:composition>
