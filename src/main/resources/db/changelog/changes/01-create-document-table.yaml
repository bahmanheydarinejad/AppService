databaseChangeLog:
  - changeSet:
      id: 01-create-document-table
      author: appservice
      changes:
        - createTable:
            tableName: document
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_document
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: statue
                  type: VARCHAR(255)
                  defaultValue: ACTIVE_STATUS
              - column:
                  name: registered_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP
              - column:
                  name: delete_date
                  type: TIMESTAMP
              - column:
                  name: type
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: data
                  type: BLOB
                  constraints:
                    nullable: false
