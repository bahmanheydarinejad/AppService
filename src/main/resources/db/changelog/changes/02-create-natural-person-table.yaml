databaseChangeLog:
  - changeSet:
      id: 02-create-natural-person-table
      author: appservice
      changes:
        - createTable:
            tableName: natural_person
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_natural_person
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: statue
                  type: VARCHAR(255)
                  defaultValue: ACTIVE_STATUS
              - column:
                  name: registered_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP
              - column:
                  name: delete_date
                  type: TIMESTAMP
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: mobile_number
                  type: VARCHAR(255)
              - column:
                  name: birth_date
                  type: TIMESTAMP
              - column:
                  name: avatar_id
                  type: VARCHAR(255)
