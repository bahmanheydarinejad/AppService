databaseChangeLog:
  - changeSet:
      id: 07-create-role-accounts-table
      author: appservice
      changes:
        - createTable:
            tableName: role_accounts
            columns:
              - column:
                  name: roles_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: accounts_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 07-create-role-panels-table
      author: appservice
      changes:
        - createTable:
            tableName: role_panels
            columns:
              - column:
                  name: roles_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: panels_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 07-create-email-attachments-table
      author: appservice
      changes:
        - createTable:
            tableName: email_attachments
            columns:
              - column:
                  name: email_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: attachments_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_email_attachments_document
